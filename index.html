    <div class="field-row">
      <div class="field"><label>สถานี PVI (ม.)</label><input id="vc_sta" type="number" step="any" value="${esc(vcState.pviSta)}" oninput="vcState.pviSta=this.value"></div>
      <div class="field"><label>ระดับ PVI (ม.)</label><input id="vc_elev" type="number" step="any" value="${esc(vcState.pviElev)}" oninput="vcState.pviElev=this.value"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>ความลาดชันเข้า g1 (%)</label><input id="vc_g1" type="number" step="any" value="${esc(vcState.g1)}" oninput="vcState.g1=this.value" placeholder="เช่น 3 หรือ -2.5"></div>
      <div class="field"><label>ความลาดชันออก g2 (%)</label><input id="vc_g2" type="number" step="any" value="${esc(vcState.g2)}" oninput="vcState.g2=this.value" placeholder="เช่น -2 หรือ 1.5"></div>
      <div class="field"><label>ความยาวโค้ง L (ม.)</label><input id="vc_l" type="number" step="any" value="${esc(vcState.L)}" oninput="vcState.L=this.value"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>ระยะห่างตารางระดับ (ม.)</label><input id="vc_interval" type="number" step="any" value="${esc(vcState.interval)}" oninput="vcState.interval=this.value"></div>
    </div>
    <div class="btn-row"><button class="btn-primary" onclick="vcCalc()">คำนวณ</button></div>
    <div id="vc_result"></div>
  `;
}
function vcCalc(){
  const res = document.getElementById('vc_result');
  const pviSta = parseFloat(document.getElementById('vc_sta').value);
  const pviElev = parseFloat(document.getElementById('vc_elev').value);
  const g1 = parseFloat(document.getElementById('vc_g1').value);
  const g2 = parseFloat(document.getElementById('vc_g2').value);
  const L = parseFloat(document.getElementById('vc_l').value);
  const interval = parseFloat(document.getElementById('vc_interval').value);
  if([pviSta,pviElev,g1,g2,L].some(isNaN) || L<=0){ res.innerHTML=`<div class="error-box">กรอกข้อมูลให้ครบและความยาวโค้ง L ต้องมากกว่า 0</div>`; return; }
  if(isNaN(interval) || interval<=0){ res.innerHTML=`<div class="error-box">กรอกระยะห่างตารางระดับให้ถูกต้อง</div>`; return; }

  const g1d = g1/100, g2d = g2/100;
  const bvcSta = pviSta - L/2, evcSta = pviSta + L/2;
  const bvcElev = pviElev - g1d*(L/2);
  const evcElev = pviElev + g2d*(L/2);
  const a = (g2d-g1d)/(2*L);     // curvature coefficient: y = bvcElev + g1d*x + a*x^2
  const kind = g1>g2 ? 'สันเขา (Crest)' : (g1<g2 ? 'ท้องคุ้ง (Sag)' : 'เส้นตรง (ไม่มีความโค้ง)');

  let hlNote = '';
  let hlX = null, hlSta = null, hlElev = null;
  if(Math.abs(g2d-g1d) > 1e-12){
    const x = -g1d/(2*a);
    if(x>=0 && x<=L){
      hlX = x; hlSta = bvcSta + x; hlElev = bvcElev + g1d*x + a*x*x;
      hlNote = `<div class="stat ${g1>g2?'warn':'good'}"><div class="lbl">${g1>g2?'จุดสูงสุด (High Point)':'จุดต่ำสุด (Low Point)'}</div><div class="val">สถานี ${fmt(hlSta,3)} = ${fmt(hlElev,3)} ม.</div></div>`;
    }
  }

  let stations = [];
  let s = 0;
  while(s < L){ stations.push(s); s += interval; }
  stations.push(L);
  const tableData = [];
  let rows = '';
  for(const x of stations){
    const elev = bvcElev + g1d*x + a*x*x;
    const sta = bvcSta + x;
    const isHl = hlX!==null && Math.abs(x-hlX)<1e-9;
    rows += `<tr${isHl?' style="color:var(--accent);font-weight:700;"':''}><td>${fmt(sta,3)}</td><td>${fmt(x,3)}</td><td>${fmt(elev,3)}</td>${isHl?' <td>← จุดสูงสุด/ต่ำสุด</td>':'<td></td>'}</tr>`;
    tableData.push({sta, x, elev});
  }

  res.innerHTML = `
    <div class="result">
      <h3>องค์ประกอบโค้งดิ่ง (${kind})</h3>
      <div class="stat-grid">
        <div class="stat"><div class="lbl">สถานี BVC</div><div class="val">${fmt(bvcSta,3)}</div></div>
        <div class="stat"><div class="lbl">ระดับ BVC</div><div class="val">${fmt(bvcElev,3)} ม.</div></div>
        <div class="stat"><div class="lbl">สถานี EVC</div><div class="val">${fmt(evcSta,3)}</div></div>
        <div class="stat"><div class="lbl">ระดับ EVC</div><div class="val">${fmt(evcElev,3)} ม.</div></div>
      </div>
      <div class="stat-grid">
        <div class="stat"><div class="lbl">สถานี PVI</div><div class="val">${fmt(pviSta,3)}</div></div>
        <div class="stat"><div class="lbl">ระดับ PVI</div><div class="val">${fmt(pviElev,3)} ม.</div></div>
        ${hlNote || `<div class="stat"><div class="lbl">จุดสูงสุด/ต่ำสุด</div><div class="val">อยู่นอกช่วงโค้ง</div></div>`}
      </div>
    </div>
    <div class="result">
      <h3>ตารางระดับตลอดแนวโค้ง</h3>
      <table><tr><th>สถานี</th><th>ระยะจาก BVC</th><th>ระดับ (ม.)</th><th></th></tr>${rows}</table>
      <div class="btn-row"><button class="btn-secondary btn-small" onclick='vcExport(${JSON.stringify(tableData)})'>ส่งออก CSV</button></div>
    </div>`;
  attachVCurvePlot(res, tableData, bvcElev, evcElev);
}
function vcExport(rows){
  const csv = 'Station,DistFromBVC,Elevation\n' + rows.map(r=>`${r.sta.toFixed(3)},${r.x.toFixed(3)},${r.elev.toFixed(3)}`).join('\n');
  downloadCsv(csv, 'vertical_curve_elevations.csv');
}
/* Simple elevation-vs-station line for the vertical curve */
function attachVCurvePlot(resultEl, rows, bvcElev, evcElev){
  const box=document.createElement('div');
  box.className='result';
  box.innerHTML='<h3>รูปตัดตามยาว (Profile)</h3>';
  resultEl.appendChild(box);
  const cv=document.createElement('canvas');
  cv.className='plot-canvas'; cv.width=320; cv.height=200;
  box.appendChild(cv);
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  const pad=34, w=cv.width-2*pad, h=cv.height-2*pad;
  const elevs = rows.map(r=>r.elev);
  const minE=Math.min(...elevs), maxE=Math.max(...elevs);
  const rng = (maxE-minE)||1;
  const L = rows[rows.length-1].x || 1;
  const X = x=> pad + (x/L)*w;
  const Y = e=> pad + h - ((e-minE)/rng)*h;
  ctx.strokeStyle='#999'; ctx.beginPath(); ctx.moveTo(pad,pad); ctx.lineTo(pad,pad+h); ctx.lineTo(pad+w,pad+h); ctx.stroke();
  ctx.strokeStyle='#C1541E'; ctx.lineWidth=2; ctx.beginPath();
  rows.forEach((r,i)=> i? ctx.lineTo(X(r.x),Y(r.elev)) : ctx.moveTo(X(r.x),Y(r.elev)));
  ctx.stroke();
  ctx.fillStyle='#1F2E2B'; ctx.font='10px sans-serif';
  ctx.fillText(fmt(maxE,2)+' ม.', pad+4, pad-6);
  ctx.fillText(fmt(minE,2)+' ม.', pad+4, pad+h+14);
  addPngButton(box, cv, 'vertical_curve_profile.png');
}

function collectProject(){
  // Traverse legs live in the DOM while that tab is open
  if(currentTab==='traverse'){
    try{ travLegCache = tvReadLegs(); }catch(e){}
  }
  return {
    _format:'survey-toolkit-project',
    _version:1,
    savedAt:new Date().toISOString(),
    angleMode: ANGLE_MODE,
    library: libPoints,
    traverse: { start:travStart, angleMode:travAngleMode, legCount:travLegCount, legs:travLegCache },
    inverse: invPts,
    area: areaPts,
    subdiv: { mode:sdMode, pts:sdPts },
    level: { mode:lvMode, pts:lvPts, secs:lvSecs, tin:lvTin, designMode:lvDesignMode },
    curve: { hz:hcState, vt:vcState },
    transform: { mode:transMode, pts:transPts },
    offsetCheck: ockPts,
    stakeout: stoPts,
    radiation: radShots
  };
}
function applyProject(p){
  if(!p || p._format!=='survey-toolkit-project') throw new Error('ไฟล์นี้ไม่ใช่โปรเจกต์ของ Survey Toolkit');
  if(p.angleMode){ ANGLE_MODE = p.angleMode; const s=document.getElementById('angleModeSel'); if(s) s.value=p.angleMode; }
  if(Array.isArray(p.library)) { libPoints = p.library; libLoaded = true; }
  if(p.traverse){
    travStart     = p.traverse.start     || travStart;
    travAngleMode = p.traverse.angleMode || travAngleMode;
    travLegCount  = p.traverse.legCount  || travLegCount;
    travLegCache  = p.traverse.legs      || [];
  }
  if(Array.isArray(p.inverse)) invPts = p.inverse;
  if(Array.isArray(p.area))    areaPts = p.area;
  if(p.subdiv){ sdMode = p.subdiv.mode || sdMode; if(Array.isArray(p.subdiv.pts)) sdPts = p.subdiv.pts; }
  if(p.level){
    lvMode = p.level.mode || lvMode;
    lvDesignMode = p.level.designMode || lvDesignMode;
    if(Array.isArray(p.level.pts))  lvPts  = p.level.pts;
    if(Array.isArray(p.level.secs)) lvSecs = p.level.secs;
    if(Array.isArray(p.level.tin))  lvTin  = p.level.tin;
  }
  if(p.curve){
    if(p.curve.hz) hcState = Object.assign(hcState, p.curve.hz);
    if(p.curve.vt) vcState = Object.assign(vcState, p.curve.vt);
  }
  if(p.transform){ transMode = p.transform.mode || transMode; if(Array.isArray(p.transform.pts)) transPts = p.transform.pts; }
  if(Array.isArray(p.offsetCheck)) ockPts = p.offsetCheck;
  if(Array.isArray(p.stakeout))    stoPts = p.stakeout;
  if(Array.isArray(p.radiation))   radShots = p.radiation;
}

    <div class="btn-row">
      <button class="btn-secondary btn-small" onclick="projSaveSlot()">บันทึก</button>
      <button class="btn-secondary btn-small" onclick="projListSlots()">โหลดรายการ</button>
    </div>
    <div id="proj_slots"></div>
    <div id="proj_msg"></div>
  </div>`;
  projShowBackend();
  projListSlots();
}

async function projShowBackend(){
  await detectBackend();
  const el = document.getElementById('proj_backend');
  if(!el) return;
  el.textContent = backendLabel();
  if(STORAGE_BACKEND === 'memory'){
    el.style.background = 'var(--rust)';
    const msg = document.getElementById('proj_msg');
    if(msg) msg.innerHTML = `<div class="note">เบราว์เซอร์นี้ไม่อนุญาตให้บันทึกถาวร (มักเกิดตอนเปิดจากในแอป) — ใช้ "ส่งออกไฟล์ .json" ไปก่อน หรือดาวน์โหลดไฟล์ HTML ไปเปิดในเบราว์เซอร์บนเครื่อง แล้วการบันทึกจะทำงานได้</div>`;
  }
}

function projExportFile(){
  const p = collectProject();
  const name = 'survey-project-' + new Date().toISOString().slice(0,10) + '.json';
  downloadText(JSON.stringify(p, null, 2), name);
  const m=document.getElementById('proj_msg');
  if(m) m.innerHTML = `<div class="note" style="color:var(--pine);font-weight:600;">✓ ส่งออกไฟล์แล้ว เก็บไฟล์นี้ไว้เปิดกลับมาทำต่อได้</div>`;
}
function projImportFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload = ev=>{
    const msg=document.getElementById('proj_msg');
    try{
      applyProject(JSON.parse(ev.target.result));
      msg.innerHTML = `<div class="note" style="color:var(--pine);font-weight:600;">✓ เปิดโปรเจกต์แล้ว — สลับไปแท็บที่ต้องการทำต่อได้เลย</div>`;
    }catch(e){
      msg.innerHTML = `<div class="error-box">เปิดไฟล์ไม่สำเร็จ: ${e.message}</div>`;
    }
  };
  reader.readAsText(file,'UTF-8');
  evt.target.value='';
}

async function projSaveSlot(){
  const msg=document.getElementById('proj_msg');
  const name=(document.getElementById('proj_name').value||'').trim();
  if(!name){ msg.innerHTML=`<div class="error-box">ตั้งชื่อโปรเจกต์ก่อนบันทึก</div>`; return; }
  msg.innerHTML=`<div class="note">กำลังบันทึก...</div>`;
  const ok = await storageSave('proj:'+name, collectProject());
  if(ok){
    let index = await storageLoad('proj-index', []);
    if(!index.includes(name)){ index.push(name); await storageSave('proj-index', index); }
    msg.innerHTML=`<div class="note" style="color:var(--pine);font-weight:600;">✓ บันทึก "${name}" แล้ว (${backendLabel()})</div>`;
    projListSlots();
  } else {
    msg.innerHTML=`<div class="error-box">เบราว์เซอร์นี้ไม่อนุญาตให้บันทึกถาวร — ใช้ปุ่ม "ส่งออกไฟล์ .json" แทน จะเชื่อถือได้เสมอ</div>`;
  }
}
async function projListSlots(){
  const el=document.getElementById('proj_slots');
  if(!el) return;
  const index = await storageLoad('proj-index', []);
  if(!index.length){ el.innerHTML=`<div class="desc">ยังไม่มีโปรเจกต์ที่บันทึกไว้ในเครื่องนี้</div>`; return; }
  el.innerHTML = index.map(name=>`
    <div class="lib-row">
      <div class="field" style="flex:1 1 auto;"><label>โปรเจกต์</label><div class="mono" style="padding:6px 0;">${name}</div></div>
      <button class="btn-secondary btn-small" onclick="projLoadSlot('${name.replace(/'/g,"\\'")}')">เปิด</button>
      <button class="btn-danger" onclick="projDeleteSlot('${name.replace(/'/g,"\\'")}')">ลบ</button>
    </div>`).join('');
}
async function projLoadSlot(name){
  const msg=document.getElementById('proj_msg');
  const p = await storageLoad('proj:'+name, null);
  if(!p){ msg.innerHTML=`<div class="error-box">เปิดโปรเจกต์ "${name}" ไม่สำเร็จ</div>`; return; }
  try{
    applyProject(p);
    msg.innerHTML=`<div class="note" style="color:var(--pine);font-weight:600;">✓ เปิด "${name}" แล้ว — สลับไปแท็บที่ต้องการทำต่อได้เลย</div>`;
  }catch(e){ msg.innerHTML=`<div class="error-box">${e.message}</div>`; }
}
async function projDeleteSlot(name){
  if(!confirm(`ลบโปรเจกต์ "${name}" ออกจากเครื่อง?`)) return;
  await storageDelete('proj:'+name);
  let index = await storageLoad('proj-index', []);
  index = index.filter(x=>x!==name);
  await storageSave('proj-index', index);
  projListSlots();
}

/* =====================================================================
   INIT
===================================================================== */
buildTabBar();
renderTab(currentTab);

async function initApp(){
  try{
    const savedAngle = await storageLoad('pref-angle-mode', 'dms');
    ANGLE_MODE = savedAngle;
    document.getElementById('angleModeSel').value = savedAngle;
    const savedOutdoor = await storageLoad('pref-outdoor', false);
    setOutdoorMode(savedOutdoor, true);
    await ensureLibLoaded();
    if(currentTab==='library') renderTab('library');
  }catch(e){ console.error('init failed', e); }
}
initApp();

</script>
